<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Revel Navigator</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #navigator {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            padding: 8px;
        }

        button {
            flex: 1;
            height: 100%;
            min-width: 0;

            border: 1px solid rgba(255,255,255,.35);
            border-radius: 8px;

            background: rgba(20,20,20,.88);
            color: #ffffff;

            font: 600 22px Arial, sans-serif;

            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        button:active {
            background: rgba(70,70,70,.95);
        }

        button:disabled {
            opacity: .5;
        }
    </style>
</head>

<body>

    <div id="navigator">

        <button id="backButton">
            Back
        </button>

        <button id="homeButton">
            Home
        </button>

    </div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
